name: Nightly properties

# The property tests under hegel.toml's nightly profile: 10,000 cases per
# property, with fresh inputs every night where CI's runs repeat the same
# derandomized ones. A deep run also judges the reach claims a property
# passes in `reachingAfter:`. A failure prints the counterexample and the
# command that reproduces it.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# The job only reads the repository; it needs no write token.
permissions:
  contents: read

jobs:
  properties:
    name: Property tests, nightly profile
    runs-on: ubuntu-latest
    # The test step took 49 to 66 minutes on the nights it passed. On
    # 2026-11-21 and 2026-11-23 it was still finishing properties when a
    # 90-minute limit cancelled it, 81 minutes in, about nine tenths done
    # (MM-460): these runners' speed varies that much. 150 minutes leaves
    # room for the slowest night seen and for more properties. The price: a
    # hang that no property's own stall limits catch ends the job an hour
    # later than it did.
    timeout-minutes: 150
    container:
      image: swift:6.4
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build --build-tests

      # The job's output is a pipe, so the test process buffers it and the
      # log arrives in 4 KB bursts, minutes apart; a cancelled run loses the
      # last one. stdbuf has the process write each line as it ends.
      #
      # Each property prints its statistics as it finishes, so those blocks
      # are the progress to watch. Swift Testing reports most `.hegel` tests
      # passed only near the end of the run: hegel-swift's threads take a
      # finished test's last step after every test not yet started.
      - name: Test the properties
        env:
          HEGEL_DEFAULT_PROFILE: nightly
          HEGEL_STATISTICS: "1"
        run: stdbuf -oL -eL swift test --filter MMPropertyTests
