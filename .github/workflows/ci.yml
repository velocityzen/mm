name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-dispatch:
    name: No Dispatch symbols
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Forbid Dispatch and GCD symbols in sources and tests
        run: |
          # Matches GCD API symbols only — not the English word "Dispatch" in prose.
          if grep -rn --include='*.swift' -E '\bDispatch(Queue|Group|Semaphore|Source|Sources|WorkItem|IO|Data|Time|TimeInterval|Wall|WallTime|Predicate|QoS|SpecificKey|Object)\b|\bdispatch_[a-z_]+\b|^[[:space:]]*import[[:space:]]+Dispatch\b' Sources Tests; then
            echo 'Dispatch/GCD symbols are forbidden in this codebase (see CLAUDE.md).'
            exit 1
          fi

  test-macos:
    name: Test (macOS)
    # The package requires Swift 6.4 (swift-tools-version 6.4), which ships
    # with Xcode 27. macos-26 has only Xcode 26.x (Swift 6.3), so this uses
    # the xcode-27 image (a GitHub preview image on macOS 27).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    # The package requires Swift 6.4 (swift-tools-version 6.4).
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test

  test-android:
    name: Test (Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on an Android emulator
        uses: skiptools/swift-android-action@v2
        with:
          # The Swift SDK for Android ships per patch release, so the
          # version is exact (6.4 alone names no release).
          swift-version: "6.4.2"
          # Peer capture reads SO_PEERGROUPS (Linux 4.13+); the API 34
          # emulator runs kernel 5.15 or newer.
          android-api-level: 34
          # Android has no /tmp; temp socket paths go under the emulator's
          # writable scratch directory.
          test-env: TMPDIR=/data/local/tmp
          # The emulator fails to boot on a nearly full runner disk.
          free-disk-space: true

  test-apple-device-platforms:
    name: Client tests (${{ matrix.name }})
    # Same image as test-macos: the simulators come with Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            platform: iOS
            device: iPhone
          - name: iPadOS
            platform: iOS
            device: iPad
          - name: tvOS
            platform: tvOS
            device: Apple TV
          - name: watchOS
            platform: watchOS
            device: Apple Watch
          - name: visionOS
            platform: visionOS
            device: Apple Vision
    steps:
      - uses: actions/checkout@v4
      - name: Pick a simulator
        id: simulator
        env:
          PLATFORM: ${{ matrix.platform }}
          DEVICE: ${{ matrix.device }}
        run: |
          udid=$(.github/scripts/simulator-destination.sh "$PLATFORM" "$DEVICE")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Boot the simulator
        # A simulator that xcodebuild boots itself can still be starting up
        # when the test runner launches, and the runner then hangs before it
        # connects. Booting first and waiting for it leaves no such race.
        timeout-minutes: 10
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl bootstatus "$UDID" -b
      - name: Run client tests
        # The MMClientStackTests scheme builds and runs the tests of what the
        # client links (MMWire, MMSchema, MMClient), never the server, CLI or
        # integration targets. Exit tests are compiled out on these platforms.
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: >
          xcodebuild test
          -scheme MMClientStackTests
          -destination "id=$UDID"
          -skipMacroValidation
          -skipPackagePluginValidation
